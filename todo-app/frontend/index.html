<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom — a small list for today</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="card__header">
      <p class="eyebrow">today's list</p>
      <div class="logo">🌸</div>
      <h1>Bloom</h1>
      <p class="tagline">Small things, tended one at a time.</p>
    </div>

    <form id="add-form" class="add-form">
      <input id="task-input" type="text" placeholder="Add a task..." autocomplete="off">
      <button type="submit">+</button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <div class="card__footer">
      <span id="count">0 left</span>
      <div class="filters">
        <button class="filter-btn is-active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>
      <button id="clear-completed" class="clear-btn">Clear done</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
