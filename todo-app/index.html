<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom — a small list for today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <header class="card__header">
      <p class="eyebrow">today's list</p>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <path d="M16 29 V14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <path d="M16 14 C 10 14, 9 8, 13 5 C 13 10, 15 12, 16 14 Z" fill="currentColor"/>
          <path d="M16 14 C 22 14, 23 8, 19 5 C 19 10, 17 12, 16 14 Z" fill="currentColor" opacity="0.72"/>
          <circle cx="16" cy="13.5" r="1.6" fill="currentColor"/>
        </svg>
      </div>
      <h1>Bloom</h1>
      <p class="tagline">Small things, tended one at a time.</p>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <input
        type="text"
        id="task-input"
        placeholder="What needs doing?"
        maxlength="120"
        aria-label="Add a task"
      >
      <button type="submit" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state">
      Nothing here yet — the day is still a blank stem.
    </p>

    <footer class="card__footer">
      <span id="count" class="count">0 left</span>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn is-active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Done</button>
      </div>
      <button id="clear-completed" class="text-btn">Clear done</button>
    </footer>
  </main>

  <p class="credit">made with a little pink</p>

  <script src="script.js"></script>
</body>
</html>
